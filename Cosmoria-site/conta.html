<!doctype html>
<html lang="pt-BR">
<head>
<title>Minha conta · Portal Cosmoria</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/comum.js"></script>
<script src="js/tema.js"></script>
</head>
<body>
<div id="topo"></div>
<main class="wrap">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:32px">
    <div><h1 style="font-size:44px;font-weight:600" id="ola">Minha conta</h1><p style="margin:4px 0 0;color:var(--texto-suave)" id="desde"></p></div>
    <button class="btn btn-linha" type="button" id="sair">Sair</button>
  </div>
  <div class="conta">
    <section class="painel" aria-labelledby="t-dados">
      <h2 id="t-dados" style="font-size:28px">Meus dados</h2>
      <form class="form" id="form-perfil">
        <div class="grade-form">
          <div class="campo"><label for="nome">Nome completo</label><input id="nome" autocomplete="name"></div>
          <div class="campo"><label for="email">E-mail</label><input id="email" type="email" disabled></div>
          <div class="campo"><label for="telefone">Celular / WhatsApp</label><input id="telefone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000"></div>
          <div class="campo"><label for="cpf">CPF</label><input id="cpf" inputmode="numeric" placeholder="000.000.000-00"><small>Usado só para emitir a nota fiscal.</small></div>
          <div class="campo"><label for="nascimento">Data de nascimento</label><input id="nascimento" type="date"></div>
        </div>
        <h3 style="font-size:22px;margin-top:8px">Endereço de entrega</h3>
        <div class="grade-form">
          <div class="campo"><label for="cep">CEP</label><input id="cep" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000"><small id="cep-msg"></small></div>
          <div class="campo" style="grid-column:span 2"><label for="rua">Rua</label><input id="rua" autocomplete="address-line1"></div>
          <div class="campo"><label for="numero">Número</label><input id="numero"></div>
          <div class="campo"><label for="complemento">Complemento</label><input id="complemento" autocomplete="address-line2"></div>
          <div class="campo"><label for="bairro">Bairro</label><input id="bairro"></div>
          <div class="campo"><label for="cidade">Cidade</label><input id="cidade" autocomplete="address-level2"></div>
          <div class="campo"><label for="uf">Estado (UF)</label><input id="uf" maxlength="2" autocomplete="address-level1"></div>
        </div>
        <label style="display:flex;gap:10px;align-items:center;font-size:14px"><input type="checkbox" id="novidades" style="width:20px;height:20px;margin:0"> Quero receber novidades e cupons por e-mail</label>
        <button class="btn btn-verde" type="submit" style="align-self:flex-start">Salvar dados</button>
        <p id="msg" role="status" class="aviso" hidden></p>
      </form>
    </section>
    <section class="painel" aria-labelledby="t-pedidos" style="flex:1 1 320px">
      <h2 id="t-pedidos" style="font-size:28px">Meus pedidos</h2>
      <div id="pedidos"><p class="carregando">Carregando...</p></div>
    </section>
  </div>
</main>
<div id="rodape"></div>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  var K = Cosmoria, sb = K.sb, esc = K.esc;
  var u = await K.usuarioAtual();
  if (!u) { location.replace('entrar.html?voltar=conta.html'); return; }
  var $ = function (id) { return document.getElementById(id); };
  var msg = $('msg');
  function aviso(t, tipo) { msg.className = 'aviso aviso-' + (tipo || 'erro'); msg.textContent = t; msg.hidden = false; }

  var r = await sb.from('perfis').select('*').eq('id', u.id).maybeSingle();
  var p = r.data;
  if (!p) { var rr = await sb.rpc('registrar_acesso', { p_nome: (u.user_metadata && u.user_metadata.nome) || null }); p = rr.data; }
  if (!p) { aviso(K.erroAmigavel(r.error || 'Não foi possível carregar seu perfil.')); return; }

  var e = p.endereco || {};
  $('nome').value = p.nome || ''; $('email').value = p.email || u.email; $('telefone').value = p.telefone || '';
  $('cpf').value = p.cpf || ''; $('nascimento').value = p.data_nascimento || ''; $('novidades').checked = !!p.aceita_novidades;
  ['cep','rua','numero','complemento','bairro','cidade','uf'].forEach(function (k) { $(k).value = e[k] || ''; });
  $('ola').textContent = 'Olá, ' + ((p.nome || u.email).split(' ')[0].split('@')[0]);
  $('desde').textContent = 'Cliente desde ' + new Date(p.criado_em).toLocaleDateString('pt-BR') + ' · ' + p.total_acessos + (p.total_acessos === 1 ? ' acesso' : ' acessos');

  $('cep').addEventListener('blur', async function () {
    var cep = this.value.replace(/\D/g, ''); if (cep.length !== 8) return;
    $('cep-msg').textContent = 'Buscando endereço...';
    try {
      var j = await (await fetch('https://viacep.com.br/ws/' + cep + '/json/')).json();
      if (j.erro) { $('cep-msg').textContent = 'CEP não encontrado.'; return; }
      $('rua').value = j.logradouro || ''; $('bairro').value = j.bairro || ''; $('cidade').value = j.localidade || ''; $('uf').value = j.uf || '';
      $('cep-msg').textContent = ''; $('numero').focus();
    } catch (err) { $('cep-msg').textContent = 'Não foi possível buscar o CEP.'; }
  });

  $('form-perfil').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var end = {}; ['cep','rua','numero','complemento','bairro','cidade','uf'].forEach(function (k) { end[k] = $(k).value.trim(); });
    end.uf = end.uf.toUpperCase();
    var up = await sb.from('perfis').update({ nome: $('nome').value.trim() || null, telefone: $('telefone').value.trim() || null,
      cpf: $('cpf').value.trim() || null, data_nascimento: $('nascimento').value || null, aceita_novidades: $('novidades').checked, endereco: end }).eq('id', u.id);
    if (up.error) aviso(K.erroAmigavel(up.error)); else aviso('Dados salvos. 🌿', 'ok');
  });

  var STATUS = { aguardando_pagamento: 'Aguardando pagamento', pago: 'Pago', em_separacao: 'Em separação', enviado: 'Enviado', entregue: 'Entregue', cancelado: 'Cancelado' };
  var ped = await sb.from('pedidos').select('id,status,total_centavos,criado_em,codigo_rastreio,itens_pedido(quantidade)').order('criado_em', { ascending: false });
  var el = $('pedidos');
  if (ped.error) el.innerHTML = '<p class="aviso aviso-erro">' + esc(K.erroAmigavel(ped.error)) + '</p>';
  else if (!ped.data.length) el.innerHTML = '<div class="vazio"><span class="emoji" aria-hidden="true">📦</span><span>Você ainda não fez pedidos.</span><a class="btn btn-verde" href="loja.html">Conhecer a loja</a></div>';
  else el.innerHTML = '<div style="display:flex;flex-direction:column;gap:10px">' + ped.data.map(function (o) {
    var n = o.itens_pedido.reduce(function (s, i) { return s + i.quantidade; }, 0);
    return '<div class="pedido"><div><strong>Pedido #' + esc(o.id.slice(0, 8).toUpperCase()) + '</strong><div style="font-size:13px;color:var(--texto-suave)">' + new Date(o.criado_em).toLocaleDateString('pt-BR') + ' · ' + n + ' itens' + (o.codigo_rastreio ? ' · Rastreio ' + esc(o.codigo_rastreio) : '') + '</div></div>' +
      '<div style="text-align:right"><strong>' + K.reais(o.total_centavos) + '</strong><div style="font-size:13px;color:var(--ouro-texto);font-weight:700">' + esc(STATUS[o.status] || o.status) + '</div></div></div>';
  }).join('') + '</div>';

  $('sair').addEventListener('click', async function () { await sb.auth.signOut(); location.replace('index.html'); });
});
</script>
</body>
</html>
