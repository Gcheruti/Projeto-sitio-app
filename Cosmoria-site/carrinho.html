<!doctype html>
<html lang="pt-BR">
<head>
<title>Carrinho · Portal Cosmoria</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/comum.js"></script>
<script src="js/tema.js"></script>
<!-- FRETE DESATIVADO (modo vitrine). Para voltar, tire o comentário: <script src="js/frete.js"></script> -->
</head>
<body>
<div id="topo"></div>
<main class="wrap">
  <h1 style="font-size:44px;font-weight:600;padding-top:32px">Seu carrinho</h1>
  <div class="carrinho">
    <section class="itens" id="itens" aria-label="Itens do carrinho"><p class="carregando">Carregando...</p></section>
    <aside class="resumo" id="resumo" aria-label="Resumo do pedido" hidden>
      <h2 style="font-size:28px">Resumo</h2>
      <div class="linha-resumo"><span>Subtotal</span><strong id="subtotal"></strong></div>
      <div class="linha-resumo"><span>Frete</span><span id="frete">Calculado no checkout</span></div>
      <p id="frete-gratis" style="margin:0;font-size:14px;color:var(--texto-suave)"></p>
      <div class="linha-resumo" style="border-top:1px solid var(--salvia-borda);padding-top:12px"><span>Total no Pix</span><strong id="total-pix" style="font-size:20px;color:var(--verde)"></strong></div>
      <span class="parcela" id="total-cartao"></span>
      <button class="btn btn-verde" type="button" id="finalizar">Finalizar compra</button>
      <p id="msg" role="status" class="aviso aviso-info" hidden></p>
      <a href="loja.html" style="text-align:center;font-weight:600">Continuar comprando</a>
    </aside>
  </div>
</main>
<div id="rodape"></div>
<script>
// CARRINHO E CHECKOUT DESATIVADOS no modo vitrine (js/config.js > modoVitrine). As compras acontecem no Mercado Livre.
// O código do carrinho continua abaixo e volta a funcionar com modoVitrine: false.
document.addEventListener('DOMContentLoaded', function () {
  if (!window.COSMORIA.modoVitrine) return;
  document.title = 'Compras pelo Mercado Livre · Portal Cosmoria';
  document.querySelector('main').innerHTML = '<div class="vazio" style="padding:72px 0"><span class="emoji" aria-hidden="true">🛡️</span>' +
    '<strong>As compras agora acontecem no Mercado Livre</strong>' +
    '<span>Escolha o produto aqui na vitrine e clique em “Comprar no Mercado Livre”. Pagamento, entrega e garantia ficam por conta do Mercado Livre, com toda a segurança.</span>' +
    '<a class="btn btn-verde" href="loja.html">Ver os produtos</a></div>';
});
document.addEventListener('DOMContentLoaded', async function () {
  if (window.COSMORIA.modoVitrine) return;
  var K = Cosmoria, sb = K.sb, esc = K.esc, C = K.config;
  var itens = K.carrinho();

  // confere preço e estoque atuais no banco
  if (itens.length) {
    var ids = itens.map(function (i) { return i.variante_id; });
    var r = await sb.from('variantes').select('id,preco_centavos,estoque,produto:produtos(preco_centavos,preco_promocional_centavos,ativo)').in('id', ids);
    if (!r.error) {
      itens = itens.filter(function (i) {
        var v = r.data.find(function (x) { return x.id === i.variante_id; });
        if (!v || !v.produto) return false;
        i.preco = (v.preco_centavos != null ? v.preco_centavos : K.precoFinal(v.produto)) + (i.personalizacao_id ? (i.adicional || 0) : 0);
        i.estoque = v.estoque; if (i.qtd > v.estoque) i.qtd = v.estoque;
        return i.qtd > 0;
      });
      K.salvarCarrinho(itens);
    }
  }

  function render() {
    var el = document.getElementById('itens'), res = document.getElementById('resumo');
    if (!itens.length) {
      res.hidden = true;
      el.innerHTML = '<div class="vazio"><span class="emoji" aria-hidden="true">🧺</span><strong>Seu carrinho está vazio</strong><span>Que tal começar pelas velas e incensos?</span><a class="btn btn-verde" href="loja.html">Ir para a loja</a></div>';
      return;
    }
    res.hidden = false;
    el.innerHTML = itens.map(function (i, n) {
      return '<div class="item"><div class="item-img" aria-hidden="true">' + (i.miniatura && /^(data:image\/|https:\/\/)/.test(i.miniatura) ? '<img src="' + esc(i.miniatura) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:10px">' : esc(i.icone || '✨')) + '</div>' +
        '<div class="item-info"><a href="' + (i.personalizacao_id ? 'personalizar.html?arte=' + encodeURIComponent(i.personalizacao_id) : 'produto.html?p=' + encodeURIComponent(i.slug)) + '">' + esc(i.nome) + '</a>' +
        (i.nome_peca ? '<div style="font-family:var(--serifa);font-size:19px;font-style:italic;color:var(--roxo,#3B2463)">“' + esc(i.nome_peca) + '”</div>' : '') +
        (i.variante ? '<div style="font-size:14px;color:var(--texto-suave)">' + esc(i.variante) + '</div>' : '') +
        (i.personalizacao_id ? '<div style="font-size:13px;color:var(--ouro-texto);font-weight:600">✨ Personalizado · arte #' + esc(String(i.personalizacao_id).slice(0, 8).toUpperCase()) + ' (inclui ' + K.reais(i.adicional || 0) + ' de personalização)</div>' : '') +
        '<div style="font-size:14px;color:var(--texto-suave)">' + K.reais(i.preco) + ' cada</div>' +
        '<button class="link-btn" data-remover="' + n + '">Remover</button></div>' +
        '<div class="qtd"><button type="button" data-menos="' + n + '" aria-label="Diminuir quantidade de ' + esc(i.nome) + '">−</button><span>' + i.qtd + '</span><button type="button" data-mais="' + n + '" aria-label="Aumentar quantidade de ' + esc(i.nome) + '">+</button></div>' +
        '<strong style="min-width:96px;text-align:right">' + K.reais(i.preco * i.qtd) + '</strong></div>';
    }).join('');
    var sub = itens.reduce(function (s, i) { return s + i.preco * i.qtd; }, 0);
    document.getElementById('subtotal').textContent = K.reais(sub);
    var falta = C.freteGratisAcima - sub;
    document.getElementById('frete-gratis').textContent = falta > 0 ? 'Faltam ' + K.reais(falta) + ' para ganhar frete grátis.' : 'Você ganhou frete grátis! 🌿';
    document.getElementById('total-pix').textContent = K.reais(Math.round(sub * (1 - C.descontoPix)));
    document.getElementById('total-cartao').textContent = 'ou ' + K.reais(sub) + ' no cartão, ' + K.parcela(sub).replace('ou ', '');
  }
  document.getElementById('itens').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.remover != null) itens.splice(+b.dataset.remover, 1);
    if (b.dataset.menos != null) { var i = itens[+b.dataset.menos]; i.qtd = Math.max(1, i.qtd - 1); }
    if (b.dataset.mais != null) { var j = itens[+b.dataset.mais]; if (j.qtd < (j.estoque || 99)) j.qtd++; }
    K.salvarCarrinho(itens); render();
  });
  document.getElementById('finalizar').addEventListener('click', async function () {
    var msg = document.getElementById('msg'), u = await K.usuarioAtual();
    msg.hidden = false;
    if (!u) { msg.innerHTML = 'Para finalizar, <a href="entrar.html?voltar=carrinho.html">entre ou crie sua conta</a>.'; return; }
    msg.textContent = 'O pagamento ainda está sendo configurado. Em breve você poderá finalizar por aqui.';
  });
  render();
});
</script>
</body>
</html>
